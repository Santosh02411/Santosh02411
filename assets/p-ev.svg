<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 236" width="405" height="236">
<defs><linearGradient id="apev" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="bgpev" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1436"/><stop offset="1" stop-color="#0c0a1d"/></linearGradient><linearGradient id="shpev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="blpev" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><clipPath id="cppev"><rect width="405" height="236" rx="20"/></clipPath></defs>
<style>.pl{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}</style>
