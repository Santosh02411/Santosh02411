f">XGBoost</text><rect x="102" y="196" width="50" height="24" rx="12" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".5"/><text x="127" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">SHAP</text><rect x="160" y="196" width="56" height="24" rx="12" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".5"/><text x="188" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">Flask</text><rect x="224" y="196" width="63" height="24" rx="12" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".5"/><text x="256" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">Pandas</text><rect x="-160" y="0" width="110" height="236" fill="url(#shpev)" transform="skewX(-18)"><animate attributeName="x" values="-160;560" dur="5.5s" begin="2s" repeatCount="indefinite"/></rect></g><rect x="1.5" y="1.5" width="402" height="233" rx="19" fill="none" stroke="url(#apev)" stroke-width="1.8" stroke-opacity=".8" stroke-dasharray="100 70"><animate attributeName="stroke-dashoffset" from="0" to="-340" dur="8s" repeatCount="indefinite"/></rect></svg>