<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 236" width="405" height="236">
<defs><linearGradient id="apmissing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="bgpmissing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1436"/><stop offset="1" stop-color="#0c0a1d"/></linearGradient><linearGradient id="shpmissing" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="blpmissing" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><clipPath id="cppmissing"><rect width="405" height="236" rx="20"/></clipPath></defs>
<style>.pl{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}</style>
<g clip-path="url(#cppmissing)"><rect width="405" height="236" fill="url(#bgpmissing)"/><circle cx="350" cy="30" r="70" fill="#22d3ee" opacity=".35" filter="url(#blpmissing)"><animate attributeName="cx" values="350;300;350" dur="7s" repeatCount="indefinite"/><animate attributeName="r" values="70;95;70" dur="7s" repeatCount="indefinite"/></circle><rect x="0" y="0" width="405" height="5" fill="url(#apmissing)"/><rect x="24" y="26" width="48" height="48" rx="13" fill="url(#apmissing)"/><text x="48" y="57" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="17" font-weight="800" fill="#fff">MP</text><text x="86" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">Missing Persons Network</text><text x="86" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#a8a3c7">Connects families, public and authorities</text><line x1="24" y1="90" x2="381" y2="90" stroke="#22d3ee" stroke-opacity=".3"/><circle class="pl" cx="31" cy="112" r="3.5" fill="#22d3ee" style="animation-delay:0.0s"/><text x="44" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e4e0fa">JWT + RBAC, TOTP 2FA, login lockout</text><circle class="pl" cx="31" cy="138" r="3.5" fill="#22d3ee" style="animation-delay:0.5s"/><text x="44" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e4e0fa">Geo-search sightings, rate limiting, audit log</text><circle class="pl" cx="31" cy="164" r="3.5" fill="#22d3ee" style="animation-delay:1.0s"/><text x="44" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e4e0fa">Cases routed to a chosen station or NGO</text><rect x="24" y="196" width="70" height="24" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="59" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">FastAPI</text><rect x="102" y="196" width="70" height="24" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="137" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">PostGIS</text><rect x="181" y="196" width="56" height="24" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="209" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">Redis</text><rect x="245" y="196" width="56" height="24" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="273" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">React</text><rect x="-160" y="0" width="110" height="236" fill="url(#shpmissing)" transform="skewX(-18)"><animate attributeName="x" values="-160;560" dur="5.5s" begin="1s" repeatCount="indefinite"/></rect></g><rect x="1.5" y="1.5" width="402" height="233" rx="19" fill="none" stroke="url(#apmissing)" stroke-width="1.8" stroke-opacity=".8" stroke-dasharray="100 70"><animate attributeName="stroke-dashoffset" from="0" to="-340" dur="7s" repeatCount="indefinite"/></rect></svg>