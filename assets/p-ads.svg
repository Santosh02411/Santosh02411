ill="#e9e5ff">Flask</text><rect x="88" y="196" width="84" height="24" rx="12" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".5"/><text x="131" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">OAuth 2.0</text><rect x="181" y="196" width="63" height="24" rx="12" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".5"/><text x="212" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">SQLite</text><rect x="252" y="196" width="50" height="24" rx="12" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".5"/><text x="277" y="212" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="11" fill="#e9e5ff">REST</text><rect x="-160" y="0" width="110" height="236" fill="url(#shpads)" transform="skewX(-18)"><animate attributeName="x" values="-160;560" dur="5.5s" begin="3s" repeatCount="indefinite"/></rect></g><rect x="1.5" y="1.5" width="402" height="233" rx="19" fill="none" stroke="url(#apads)" stroke-width="1.8" stroke-opacity=".8" stroke-dasharray="100 70"><animate attributeName="stroke-dashoffset" from="0" to="-340" dur="9s" repeatCount="indefinite"/></rect></svg>