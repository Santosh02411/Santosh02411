<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 236" width="405" height="236">
<defs><linearGradient id="apads" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/></linearGradient><linearGradient id="bgpads" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1436"/><stop offset="1" stop-color="#0c0a1d"/></linearGradient><linearGradient id="shpads" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="blpads" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><clipPath id="cppads"><rect width="405" height="236" rx="20"/></clipPath></defs>
